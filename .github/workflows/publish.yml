# 自动上架:package.json 版本号与市场不同时,自动构建并发布到 VS Code Marketplace
# 前置:发布仓 Settings → Secrets and variability → Actions 里配置 VSCE_PAT
#       (PAT,需 Marketplace: Manage 权限,publisher = sh-u-x-in)。
# 用法:改版本号 → push(或手动 workflow_dispatch)→ 自动发布;版本未变则跳过。
name: Publish to VS Code Marketplace

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compare version with marketplace
        id: version
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npx vsce show sh-u-x-in.ros2-dev-extension --json 2>/dev/null | jq -r '.versions[0].version // ""')
          echo "local=$LOCAL published=$PUBLISHED"
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.version.outputs.skip == 'false'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish -p "$VSCE_PAT"
