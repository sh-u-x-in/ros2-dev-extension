# 发布仓质量门:每次推送验证源码可安装、可编译、可打包
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile (tsc)
        run: npx tsc -p ./ --noEmit

      - name: Package (webpack production)
        run: npx webpack --mode production --devtool source-map --no-optimization-minimize

      # 完整测试套件需下载 VS Code 测试宿主(~150MB)与 xvfb,需要时放开:
      # - name: Run tests
      #   run: |
      #     sudo apt-get update && sudo apt-get install -y xvfb
      #     xvfb-run -a npm test
